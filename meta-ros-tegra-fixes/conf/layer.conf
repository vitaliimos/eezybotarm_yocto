BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ros-tegra-fixes"
BBFILE_PATTERN_ros-tegra-fixes = "^${LAYERDIR}/"
BBFILE_PRIORITY_ros-tegra-fixes = "15"

LAYERVERSION_ros-tegra-fixes = "1"
LAYERSERIES_COMPAT_ros-tegra-fixes = "wrynose"
LAYERDEPENDS_ros-tegra-fixes = "core tegra ros2-jazzy-layer"
