DISTRO = "eezybot"
DISTRO_NAME = "EezyBot"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "wrynose"

TARGET_VENDOR = "-eezybot"

INIT_MANAGER = "systemd"

# Signed up on top of DISTRO_FEATURES_DEFAULTS (wayland, x11, etc. are already
# part of the defaults). "pam" is used for PAM support where needed.
DISTRO_FEATURES:append = " pam"


# The Orin Nano devkit recommends "kernel-module-realtek" (meta-tegra
# conf/machine/include/p3768.inc), but that package only exists for the
# mainline linux-yocto kernel. With the vendored NVIDIA kernel the NIC is
# driven by the out-of-tree nv-kernel-module-r8168 instead, so drop the
# phantom package.
MACHINE_EXTRA_RRECOMMENDS:remove = "kernel-module-realtek"

hostname:pn-base-files = "eezybot"

# Map non-SPDX BSD license to BSD-3-Clause for meta-ros recipes
SPDXLICENSEMAP[BSD] = "BSD-3-Clause"

# Consolidate native build tool dependencies for ROS parameter generator
ROS_BUILDTOOL_DEPENDS:append:pn-control-toolbox = " generate-parameter-library-py-native"
ROS_BUILDTOOL_DEPENDS:append:pn-joint-limits = " generate-parameter-library-py-native"
ROS_BUILDTOOL_DEPENDS:append:pn-joint-state-broadcaster = " generate-parameter-library-py-native"
ROS_BUILDTOOL_DEPENDS:append:pn-joint-trajectory-controller = " generate-parameter-library-py-native"

# oe-core provides clang and openmp (libomp), so remove them from meta-ros skip groups
# without requiring meta-clang or fake BBFILE_COLLECTIONS.
ROS_WORLD_SKIP_GROUPS:remove = "libomp clang"
