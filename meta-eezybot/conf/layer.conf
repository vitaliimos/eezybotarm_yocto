BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "eezybot"
BBFILE_PATTERN_eezybot = "^${LAYERDIR}/"
BBFILE_PRIORITY_eezybot = "10"

LAYERVERSION_eezybot = "1"
LAYERSERIES_COMPAT_eezybot = "wrynose"
LAYERDEPENDS_eezybot = "core openembedded-layer ros2-jazzy-layer"
