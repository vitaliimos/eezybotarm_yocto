BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "eezybot-distro"
BBFILE_PATTERN_eezybot-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_eezybot-distro = "15"

LAYERVERSION_eezybot-distro = "1"
LAYERSERIES_COMPAT_eezybot-distro = "wrynose"
LAYERDEPENDS_eezybot-distro = "core openembedded-layer meta-python networking-layer tegra ros2-layer ros2-jazzy-layer eezybot"
